<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CoverArt</title>
<style>
  :root{
    --ease:cubic-bezier(.32,.72,0,1);
    --hair:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%;margin:0}
  body{
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",
                "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:14px; letter-spacing:-.01em; line-height:1.4;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    overflow:hidden;
    user-select:none; -webkit-user-select:none; cursor:default;
  }
  button{font:inherit; color:inherit; letter-spacing:inherit; background:none; border:0; padding:0; cursor:pointer}
  a{color:inherit; text-decoration:none}
  img{-webkit-user-drag:none; user-select:none}
  ::selection{background:rgba(255,255,255,.22)}

  /* ================= 窗口（就是封面本身） =================
     Windows 程序里窗口尺寸由 tauri.conf.json 固定（默认 560×560，不可缩放），
     所以这里直接铺满整窗，不留圆角和阴影——那些交给系统窗口本身。 */
  #win{
    position:relative;
    width:100%; height:100%;
    overflow:hidden;
    background:#121214;
    perspective:1600px;
    isolation:isolate;
  }

  #flip{position:absolute; inset:0; transform-style:preserve-3d;
        transition:transform .58s var(--ease), opacity .36s var(--ease), filter .36s var(--ease)}
  #win.flipped #flip{transform:rotateY(180deg)}
  .face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden}
  .back{transform:rotateY(180deg)}
  /* 转到背面的那一面不参与点击：否则正面右上角的 ✕ 会正好压在背面左上角的返回箭头上
     （backface-visibility:hidden 只是不画它，仍然能被点到） */
  #win.flipped .front, #win:not(.flipped) .back{pointer-events:none}

  /* ---------- 封面 ---------- */
  .art{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
       opacity:0;
       transition:opacity .42s var(--ease), filter .22s var(--ease), transform .22s var(--ease)}
  .art.in{opacity:1}
  /* 图还没到：把正在显示的那张磨成一团玻璃（模糊 + 压暗 + 轻微放大），
     而不是继续清清楚楚地留着上一张——快速连点「下一张」时尤其明显 */
  .art.blurred{filter:blur(26px) brightness(.6) saturate(1.05); transform:scale(1.07)}
  .frost{
    position:absolute; inset:0; pointer-events:none; opacity:0;
    background:rgba(10,10,12,.34);
    transition:opacity .2s var(--ease);
  }
  #win.loading .frost{opacity:1}

  /* ---------- 悬停层（静止时完全消失） ---------- */
  .veil{
    position:absolute; inset:auto 0 0 0; height:46%; pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,.66), rgba(0,0,0,.3) 42%, transparent);
    opacity:0; transition:opacity .28s var(--ease);
  }
  /* 底部信息条：标题、序号、图标静止 2.6 秒后一起隐去，只剩封面 */
  .hudbar{
    position:absolute; inset:auto 0 0 0; padding:0 16px 14px;
    display:flex; align-items:flex-end; justify-content:space-between; gap:14px;
  }
  #win.hud-on .veil, #win.hud-on .meta, #win.hud-on .icon-btn, #win.hud-on .count,
  #win.hud-on .nv{opacity:1}
  #win.hud-on .topbar, #win.searching .topbar{opacity:1; pointer-events:auto}
  #win.flipped .veil, #win.flipped .hudbar, #win.flipped .nv,
  #win.flipped .topbar{opacity:0 !important; transition:none}
  .meta{min-width:0; opacity:0; transition:opacity .28s var(--ease)}
  .ttl{font-size:14.5px; font-weight:600; letter-spacing:-.015em; color:#fff;
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
       text-shadow:0 1px 12px rgba(0,0,0,.4)}
  .by{margin-top:2px; font-size:12.5px; color:rgba(255,255,255,.72);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .hudbar-right{display:flex; align-items:center; gap:8px; flex:none}
  /* 第几张 / 共几张，跟图标一起出现在右下角 */
  .count{
    /* 胶囊：高度和旁边两颗圆按钮齐平（32px），宽度跟着文字走 */
    height:32px; padding:0 12px; flex:none;
    display:flex; align-items:center; justify-content:center;
    border-radius:999px;
    opacity:0; transition:opacity .28s var(--ease);
    /* 和两颗圆按钮同一种磨砂：深色半透 + 模糊 + 一圈内描边，任何封面都看得清 */
    background:rgba(0,0,0,.36);
    -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
    font-size:11.5px; font-weight:600; letter-spacing:0;
    font-variant-numeric:tabular-nums; white-space:nowrap;
    color:rgba(255,255,255,.95);
  }
  .count:empty{display:none}                 /* 搜索来的专辑没有序号，整颗收掉 */
  #win.hud-on .count{opacity:1}
  /* 下载 / 翻面这类圆形小按钮（只有图标，没有文字） */
  .icon-btn{
    width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
    /* 深色磨砂 + 1px 内描边：白图标压在亮封面上也不会糊掉 */
    background:rgba(0,0,0,.36); color:rgba(255,255,255,.95);
    -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
    opacity:0;
    transition:opacity .28s var(--ease), background-color .18s var(--ease),
               transform .18s var(--ease), color .18s var(--ease);
  }
  .icon-btn:hover{background:rgba(0,0,0,.52)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn svg{width:17px; height:17px}
  .icon-btn.done{background:rgba(255,255,255,.92); color:#111}

  /* ---------- 顶部：每日 / 搜索（液态玻璃胶囊） ---------- */
  .topbar{
    position:absolute; top:11px; left:50%; z-index:7;
    display:flex; gap:2px; padding:3px; border-radius:999px;
    transform:translateX(-50%) translateZ(0);
    background:linear-gradient(180deg,
      rgba(255,255,255,.26), rgba(255,255,255,.10) 55%, rgba(255,255,255,.17));
    -webkit-backdrop-filter:blur(22px) saturate(200%) brightness(1.06);
    backdrop-filter:blur(22px) saturate(200%) brightness(1.06);
    box-shadow:
      inset 0 .5px 0 rgba(255,255,255,.62),      /* 上沿高光 */
      inset 0 -1px 0 rgba(0,0,0,.22),            /* 下沿暗边 */
      inset 0 0 0 .5px rgba(255,255,255,.18),    /* 玻璃细描边 */
      0 1px 1px rgba(0,0,0,.18),
      0 10px 26px rgba(0,0,0,.34);               /* 悬浮投影 */
    isolation:isolate;
    opacity:0; pointer-events:none;
    transition:opacity .3s var(--ease);
  }
  /* 斜向掠光：玻璃上那一道反光 */
  .topbar::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(118deg,
      rgba(255,255,255,.55) 0%, rgba(255,255,255,.14) 24%, rgba(255,255,255,0) 52%);
    opacity:.7; mix-blend-mode:screen;
  }
  /* 内部折射的亮边 */
  .topbar::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    box-shadow:inset 0 -7px 12px -9px rgba(255,255,255,.85),
               inset 0 5px 10px -8px rgba(255,255,255,.5);
  }
  /* 选中态：一块自己也会动玻璃滑块 */
  .pill{
    /* 位置和宽度全部由 CSS 决定（「每日」「搜索」都是两个字，等宽），
       不依赖 JS 量尺寸，也就不会出现"滑块卡在半路"的状态 */
    position:absolute; top:3px; bottom:3px; left:3px;
    width:calc((100% - 10px) / 3); border-radius:999px;   /* 三个标签，等宽 */
    background:linear-gradient(180deg, rgba(255,255,255,.97), rgba(255,255,255,.82));
    box-shadow:
      inset 0 .5px 0 rgba(255,255,255,1),
      inset 0 -1px 1px rgba(0,0,0,.06),
      0 1px 2px rgba(0,0,0,.2),
      0 6px 18px rgba(0,0,0,.26);
    transition:transform .46s var(--ease), width .46s var(--ease), opacity .3s var(--ease);
  }
  .topbar:has(#tab-day[aria-selected="true"]) .pill{transform:translateX(0)}
  .topbar:has(#tab-fav[aria-selected="true"]) .pill{transform:translateX(calc(100% + 2px))}
  .topbar:has(#tab-search[aria-selected="true"]) .pill{transform:translateX(calc((100% + 2px) * 2))}
  /* 收藏为空时这个标签不可点 */
  .topbar button:disabled{opacity:.38; cursor:default}
  .topbar button:disabled:hover{color:rgba(255,255,255,.72)}
  #win.on-light .topbar button:disabled:hover{color:rgba(28,28,30,.74)}
  /* 两种都不选中（正在看搜索选来的专辑）时，滑块收起来 */
  #win.mode-guest .pill{opacity:0}
  .topbar button{
    position:relative; z-index:1;
    padding:4px 15px; border-radius:999px; font-size:12px; font-weight:500;
    color:rgba(255,255,255,.72);
    transition:color .3s var(--ease), transform .2s var(--ease);
  }
  .topbar button:hover{color:rgba(255,255,255,.95)}
  .topbar button:active{transform:scale(.95)}
  .topbar button[aria-selected="true"],
  .topbar button[aria-selected="true"]:hover{color:#141414}

  /* ---------- 亮封面下的自适应：浅色玻璃 + 深色字，选中滑块翻成深色 ----------
     靠 win.on-light 切换，颜色由封面上方那条画面的平均亮度决定 */
  #win.on-light .topbar{
    background:linear-gradient(180deg,
      rgba(255,255,255,.66), rgba(255,255,255,.44) 55%, rgba(255,255,255,.58));
    box-shadow:
      inset 0 .5px 0 rgba(255,255,255,.95),
      inset 0 -1px 0 rgba(0,0,0,.14),
      inset 0 0 0 .5px rgba(255,255,255,.55),
      0 1px 1px rgba(0,0,0,.12),
      0 10px 26px rgba(0,0,0,.24);
  }
  #win.on-light .topbar::before{opacity:.42}
  #win.on-light .topbar button{color:rgba(28,28,30,.74)}
  #win.on-light .topbar button:hover{color:#000}
  #win.on-light .topbar button[aria-selected="true"],
  #win.on-light .topbar button[aria-selected="true"]:hover{color:#fff}
  #win.on-light .pill{
    background:linear-gradient(180deg, rgba(38,38,40,.92), rgba(22,22,24,.82));
    box-shadow:
      inset 0 .5px 0 rgba(255,255,255,.28),
      inset 0 -1px 1px rgba(0,0,0,.3),
      0 2px 5px rgba(0,0,0,.3),
      0 6px 18px rgba(0,0,0,.3);
  }
  /* 左右切换箭头同理：亮封面下换成深色 */
  #win.on-light .nv{color:#161616; filter:drop-shadow(0 1px 5px rgba(255,255,255,.55))}
  #win.on-light .nv:hover{background:rgba(255,255,255,.72)}

  /* ---------- 左右切换（只在悬停时出现） ---------- */
  .nv{
    position:absolute; top:50%; margin-top:-22px; width:44px; height:44px;
    display:grid; place-items:center; border-radius:50%; color:#fff;
    opacity:0; transition:opacity .28s var(--ease), background-color .18s var(--ease);
    filter:drop-shadow(0 1px 6px rgba(0,0,0,.5));
  }
  .nv:hover{background:rgba(255,255,255,.16);
            -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px)}
  .nv svg{width:24px; height:24px}
  .nv.prev{left:6px}
  .nv.next{right:6px}
  /* 正在看一张搜索选来的专辑：左右箭头照常可用——翻的是「搜索结果那一串」 */
  /* 刚选中搜索结果那一下，顶栏先收起来；鼠标一动就回来（回来时两个标签都不高亮） */
  #win.hud-on.tb-late .topbar{opacity:0; pointer-events:none}

  /* ---------- 角标：发行纪念日 ---------- */
  .badge{
    position:absolute; top:12px; left:12px; padding:4px 9px; border-radius:999px;
    font-size:11px; font-weight:500; color:rgba(255,255,255,.94);
    background:rgba(0,0,0,.4);
    -webkit-backdrop-filter:blur(14px) saturate(160%); backdrop-filter:blur(14px) saturate(160%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  }

  /* ================= 背面：唱片封套的背面（纸感 + 印刷排版） ================= */
  .back{background:#efeae0}
  /* 封面被当成油墨，淡淡地印在纸上；每张专辑的纸色因此都不一样 */
  .back .bg{position:absolute; inset:-12%; width:124%; height:124%; object-fit:cover;
            filter:blur(54px) saturate(125%); opacity:.3; transform:scale(1.04)}
  .back::after{content:""; position:absolute; inset:0; z-index:1;
    background:
      radial-gradient(120% 90% at 22% 0%, rgba(255,255,255,.7), rgba(255,255,255,0) 62%),
      linear-gradient(180deg, rgba(248,245,239,.84), rgba(231,225,214,.9))}
  /* 左边一条书脊 */
  .spine{position:absolute; left:0; top:0; bottom:0; width:13px; z-index:2;
         background:linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,.03) 58%, rgba(0,0,0,.1));
         box-shadow:inset -1px 0 0 rgba(0,0,0,.16)}
  .inner{position:relative; z-index:3; height:100%; display:flex; flex-direction:column;
         padding:13px 16px 13px 27px; color:#1c1a17}

  .bk-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px}
  .bk-back{
    width:24px; height:24px; margin:-2px 0 0 -5px; display:grid; place-items:center;
    border-radius:50%; color:rgba(28,26,23,.58);
    transition:background-color .18s var(--ease), color .18s var(--ease);
  }
  .bk-back:hover{background:rgba(0,0,0,.08); color:#000}
  .bk-back svg{width:17px; height:17px}
  /* 像印在封套上的编号 */
  .cat{font-size:9.5px; letter-spacing:.14em; color:rgba(28,26,23,.48); white-space:nowrap;
       font-variant-numeric:tabular-nums}

  .bk-title{margin-top:9px; font-size:16.5px; font-weight:600; letter-spacing:-.02em;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .bk-artist{margin-top:2px; font-size:12.5px; color:rgba(28,26,23,.66)}
  .bk-facts{margin-top:6px; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
            color:rgba(28,26,23,.48); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .bk-facts b{font-weight:500}
  .rule{height:1px; background:rgba(28,26,23,.2); margin:9px 0 4px}

  .tracks{flex:1; min-height:0; margin:0; padding:0; list-style:none;
          overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none;
          font-variant-numeric:tabular-nums}
  .tracks::-webkit-scrollbar{width:0}
  .tracks li{display:flex; align-items:baseline; gap:7px; height:23px;
             font-size:12px; color:rgba(28,26,23,.88)}
  .tracks li .n{width:18px; flex:none; font-size:10px; letter-spacing:.02em; color:rgba(28,26,23,.42)}
  .tracks li .t{flex:0 1 auto; max-width:76%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tracks li .lead{flex:1; min-width:10px; align-self:center;
                   border-bottom:1px dotted rgba(28,26,23,.32)}
  .tracks li .d{flex:none; font-size:10.5px; color:rgba(28,26,23,.52)}
  .tracks li.dim .t{color:rgba(28,26,23,.45)}
  /* 唱片的两面 */
  .tracks li.side{height:24px; margin-top:7px; gap:8px;
                  font-size:9px; letter-spacing:.16em; color:rgba(28,26,23,.5)}
  .tracks li.side:first-child{margin-top:0}
  .tracks li.side::after{content:""; flex:1; align-self:center; height:1px; background:rgba(28,26,23,.18)}

  .bk-foot{margin-top:auto; padding-top:8px; border-top:1px solid rgba(28,26,23,.2);
           display:flex; align-items:flex-end; justify-content:space-between; gap:10px}
  .ft-links{display:flex; gap:14px; font-size:11.5px; color:rgba(28,26,23,.7)}
  .ft-links a:hover{color:#000}
  .ft-line{margin-top:5px; font-size:9px; letter-spacing:.1em; text-transform:uppercase;
           color:rgba(28,26,23,.44); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .barcode{flex:none; width:64px; height:24px; opacity:.66;
    background:repeating-linear-gradient(90deg,
      #1c1a17 0 1px, transparent 1px 3px, #1c1a17 3px 4px, transparent 4px 7px,
      #1c1a17 7px 9px, transparent 9px 11px)}

  /* ================= 搜索（同一窗口内浮起） ================= */
  #search{
    position:absolute; inset:0; z-index:5; display:flex; flex-direction:column;
    background:linear-gradient(180deg, rgba(18,18,21,.78), rgba(14,14,17,.72));
    -webkit-backdrop-filter:blur(30px) saturate(200%);
    backdrop-filter:blur(30px) saturate(200%);
    box-shadow:inset 0 .5px 0 rgba(255,255,255,.22);
    /* 从顶栏那一点「化开」：缩放 + 模糊 + 淡入 */
    transform-origin:50% 26px;      /* 从顶部那颗胶囊的中心化开 */
    transform:scale(.94) translateY(-8px);
    opacity:0; visibility:hidden;
    transition:opacity .3s var(--ease), transform .44s var(--ease),
               filter .44s var(--ease), visibility 0s linear .44s;
    filter:blur(6px);
  }
  #win.searching #search{
    transform:none; opacity:1; visibility:visible; filter:none;
    transition:opacity .3s var(--ease), transform .44s var(--ease),
               filter .44s var(--ease), visibility 0s;
  }
  /* 背后那张封面往后退：缩小 + 轻微模糊 + 压暗，配合搜索页面浮上来 */
  #win.searching #flip{opacity:.45; transform:scale(.965); filter:blur(4px)}
  #win.searching.flipped #flip{transform:rotateY(180deg) scale(.965)}
  /* 顶部留出每日/搜索那颗胶囊的位置，输入框落在它下面 */
  .s-top{display:flex; align-items:center; gap:10px; padding:54px 18px 12px;
         border-bottom:1px solid rgba(255,255,255,.1)}
  .s-top svg{width:17px; height:17px; flex:none; color:rgba(255,255,255,.45)}
  #q{
    flex:1; min-width:0; background:none; border:0; outline:0; padding:0;
    font:inherit; font-size:17px; font-weight:500; letter-spacing:-.015em; color:#fff;
  }
  #q::placeholder{color:rgba(255,255,255,.34)}
  .s-state{flex:none; font-size:11px; color:rgba(255,255,255,.45); font-variant-numeric:tabular-nums}
  .s-list{flex:1; min-height:0; overflow-y:auto; padding:6px; scrollbar-width:none}
  .s-list::-webkit-scrollbar{width:0}
  .r{display:flex; align-items:center; gap:10px; width:100%; padding:7px 9px;
     border-radius:9px; text-align:left; transition:background-color .14s var(--ease)}
  .r img{width:38px; height:38px; border-radius:6px; flex:none; object-fit:cover;
         background:rgba(255,255,255,.08); box-shadow:0 1px 5px rgba(0,0,0,.4)}
  .r-txt{min-width:0}
  .r-t{font-size:13px; color:rgba(255,255,255,.95); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .r-a{margin-top:1px; font-size:11.5px; color:rgba(255,255,255,.5);
       white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .r.on{background:rgba(255,255,255,.14)}
  .s-msg{padding:22px 16px; font-size:12.5px; color:rgba(255,255,255,.6); text-align:center; line-height:1.7}
  .s-msg button{margin-top:10px; padding:5px 13px; border-radius:999px;
                background:rgba(255,255,255,.14); font-size:12px; color:#fff}
  .s-msg button:hover{background:rgba(255,255,255,.24)}
  .s-hint{padding:9px 0 11px; text-align:center; font-size:11px; color:rgba(255,255,255,.38)}

  /* ================= 首次加载 / 出错 ================= */
  @keyframes fade{from{opacity:0} to{opacity:1}}
  /* 加载今天这 20 张：整窗是一块磨砂玻璃（有高光、有一道慢慢扫过的高光条），
     不然冷启动时背后什么都没有，纯黑一片会让人以为程序卡住了 */
  #boot{position:absolute; inset:0; z-index:8; display:grid; place-items:center; overflow:hidden;
        background:
          radial-gradient(110% 80% at 22% 6%, rgba(255,255,255,.20), rgba(255,255,255,0) 60%),
          radial-gradient(90% 70% at 88% 100%, rgba(150,175,255,.16), rgba(255,255,255,0) 62%),
          linear-gradient(160deg, rgba(64,66,76,.72), rgba(22,23,28,.84));
        -webkit-backdrop-filter:blur(40px) saturate(160%);
        backdrop-filter:blur(40px) saturate(160%);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.16);
        transition:opacity .4s var(--ease)}
  #boot::after{content:""; position:absolute; inset:-30%;
        background:linear-gradient(102deg, transparent 38%, rgba(255,255,255,.14) 50%, transparent 62%);
        animation:sheen 2.8s linear infinite}
  @keyframes sheen{from{transform:translateX(-42%)} to{transform:translateX(42%)}}
  #boot.off{opacity:0; pointer-events:none}
  .spin{position:relative; z-index:1; width:19px; height:19px; border-radius:50%;
        border:1.5px solid rgba(255,255,255,.22); border-top-color:rgba(255,255,255,.85);
        animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #err{position:absolute; inset:0; z-index:4; display:grid; place-items:center;
       background:rgba(12,12,14,.92); text-align:center; padding:24px}
  #err p{margin:0; font-size:12.5px; color:rgba(255,255,255,.62); line-height:1.7}
  #err button{margin-top:12px; padding:6px 15px; border-radius:999px;
              background:rgba(255,255,255,.14); font-size:12px}
  #err button:hover{background:rgba(255,255,255,.24)}

  /* ================= 首次提示 / 预览说明 ================= */
  #hint{position:absolute; left:50%; bottom:14%; transform:translateX(-50%); z-index:3;
        padding:6px 13px; border-radius:999px; font-size:11.5px; color:rgba(255,255,255,.86);
        background:rgba(0,0,0,.42); white-space:nowrap; pointer-events:none;
        -webkit-backdrop-filter:blur(16px) saturate(160%); backdrop-filter:blur(16px) saturate(160%);
        animation:fade .4s var(--ease)}
  #hint.off{opacity:0; transition:opacity .6s var(--ease)}
  /* 右上角：收起到托盘（Tauri 里才有，浏览器打开时会被脚本移除） */
  .close-btn{position:absolute; top:12px; right:12px; z-index:4}

  /* 右键弹出的收藏心形：位置由 JS 设在鼠标处，默认空心，收藏后变红并轻跳一下 */
  .heart{
    position:absolute; z-index:6; width:38px; height:38px; margin:-19px 0 0 -19px;
    display:grid; place-items:center; border-radius:50%;
    background:rgba(0,0,0,.38); color:rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(16px) saturate(170%); backdrop-filter:blur(16px) saturate(170%);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16), 0 6px 18px rgba(0,0,0,.35);
    opacity:0; transform:scale(.6); pointer-events:none;
    transition:opacity .12s var(--ease), transform .12s var(--ease),
               background-color .18s var(--ease), color .18s var(--ease);
  }
  .heart.show{opacity:1; transform:scale(1); pointer-events:auto}
  .heart.show:hover{background:rgba(0,0,0,.55)}
  .heart.faved{color:#ff3b30}          /* 已收藏：红心 */
  .heart.pop{transform:scale(1.18)}
  .heart svg{width:20px; height:20px}
  .heart.faved svg{fill:currentColor}
  /* 失败时抖一下，表示"没成功"，不假装成功 */
  .heart.nope{animation:heart-shake .4s var(--ease)}
  @keyframes heart-shake{
    0%,100%{margin-left:-19px}
    25%{margin-left:-25px}
    75%{margin-left:-13px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important}
  }
</style>
</head>
<body>

<div id="win">
  <!-- 无边框窗口的拖动区：顶部一条看不见的窄带（悬停控件在它上层，所以照常能点） -->
  <div id="flip">

    <!-- ============ 正面：只有封面 ============ -->
    <div class="face front">
      <img class="art" id="artA" alt="" draggable="false" crossorigin="anonymous">
      <img class="art" id="artB" alt="" draggable="false" crossorigin="anonymous">
      <div class="frost"></div>
      <div class="veil"></div>
      <div class="badge" id="badge" hidden>发行纪念日</div>

      <!-- 右键出现的收藏心形：跟着鼠标位置弹出来，点一下收藏（红心），再点取消 -->
      <button class="heart" id="heart" type="button" aria-label="收藏" title="收藏 / 取消收藏">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20.3 4.9 13.4A4.6 4.6 0 0 1 12 7.3a4.6 4.6 0 0 1 7.1 6.1Z"/>
        </svg>
      </button>

      <!-- 右上角：收起到托盘 -->
      <button class="icon-btn close-btn" id="btn-close" type="button" aria-label="收起到托盘" title="收起到托盘">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M7.5 7.5l9 9M16.5 7.5l-9 9"/></svg>
      </button>

      <button class="nv prev" id="prev" type="button" aria-label="上一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 8 12l6.5 7"/></svg>
      </button>
      <button class="nv next" id="next" type="button" aria-label="下一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5 16 12l-6.5 7"/></svg>
      </button>

      <!-- 底部信息条：鼠标静止 2.6 秒后自动消失，窗口回到纯封面 -->
      <div class="hudbar">
        <div class="meta">
          <div class="ttl" id="m-title"></div>
          <div class="by" id="m-artist"></div>
        </div>
        <div class="hudbar-right">
          <span class="count" id="m-count"></span>
          <button class="icon-btn" id="to-back" type="button" aria-label="查看曲目" title="查看曲目">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 11v5.4M12 7.9v.1"/></svg>
          </button>
          <button class="icon-btn" id="dl" type="button" aria-label="下载原图（3000×3000）" title="下载原图（3000×3000）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.2v10.4M8 10.8l4 3.8 4-3.8M5.2 18.4h13.6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ============ 背面：同尺寸的唱片封套背面 ============ -->
    <div class="face back">
      <img class="bg" id="backBg" alt="" aria-hidden="true">
      <div class="spine"></div>
      <div class="inner">
        <div class="bk-top">
          <button class="bk-back" id="to-front" type="button" aria-label="返回封面">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 8 12l6.5 7"/></svg>
          </button>
          <span class="cat" id="b-cat"></span>
        </div>
        <div>
          <div class="bk-title" id="b-title"></div>
          <div class="bk-artist" id="b-artist"></div>
          <div class="bk-facts" id="b-facts"></div>
        </div>
        <div class="rule"></div>
        <ol class="tracks" id="b-tracks"></ol>
        <div class="bk-foot">
          <div>
            <div class="ft-links">
              <a id="b-apple" href="#" target="_blank" rel="noopener" title="在浏览器中打开 Apple Music 专辑页">Apple Music ↗</a>
              <a id="b-hires" href="#" target="_blank" rel="noopener" title="在浏览器中打开 3000×3000 原图">看原图 ↗</a>
            </div>
            <div class="ft-line" id="b-line"></div>
          </div>
          <div class="barcode" aria-hidden="true"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- 顶部：每日 / 搜索。液态玻璃胶囊，悬浮在最上层（搜索时也在） -->
  <div class="topbar" role="tablist" aria-label="视图">
    <span class="pill" id="tab-pill" aria-hidden="true"></span>
    <button id="tab-day" type="button" role="tab" aria-selected="true">每日</button>
    <button id="tab-fav" type="button" role="tab" aria-selected="false" disabled>收藏</button>
    <button id="tab-search" type="button" role="tab" aria-selected="false">搜索</button>
  </div>

  <!-- ============ 搜索：不改变窗口大小，浮在封面上 ============ -->
  <div id="search">
    <div class="s-top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="text" placeholder="搜索音乐人或专辑" autocomplete="off" spellcheck="false" aria-label="搜索音乐人或专辑">
      <span class="s-state" id="s-state"></span>
    </div>
    <div class="s-list" id="s-list"></div>
    <div class="s-hint">↑↓ 选择 · ↵ 打开 · esc 返回</div>
  </div>

  <div id="err" hidden>
    <p id="err-text"></p>
    <button id="err-retry" type="button">重试</button>
  </div>

  <div id="boot"><span class="spin"></span></div>
</div>

<script>
/* =========================================================================
   CoverArt 极简原型：窗口 = 封面
   每日 20 张（每天联网随机抽，60 天内不重复）｜ ← → 换封面 ｜ 双击翻面看曲目和详情
   打字或 ⌘K 搜索 ｜ 右下角下载 3000×3000 ｜ T 回到今天
   数据源：iTunes 榜单 + Search / Lookup API（无需 Key），封面最高 3000×3000
   ========================================================================= */


const API = "https://itunes.apple.com";
const SIZE = { hi:"3000x3000bb.jpg", mid:"1000x1000bb.jpg", blur:"600x600bb.jpg", thumb:"100x100bb.jpg" };
const art = (a, s) => `${a.art}/${s}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = (s) => String(s ?? "").toLowerCase().normalize("NFKC").replace(/[\s\-_·・,.'"’()\[\]]/g, "");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const fmt = (ms) => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const key = (a) => a.id + ":" + a.sf;

const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

/* ---------------- 状态 ---------------- */
let dayKey = iso(new Date());
let dayQueue = [];      /* 今天这一屏的 20 张，见 loadDaily() */
let queue = [];         /* 当前正在翻的这一串（每日 / 收藏） */
let dailyBusy = false;  /* 正在拉今天这 20 张 */
let pos = 0;
let current = null;
let mode = "day";       /* day（今日这一屏）| search（搜索浮层）| guest（搜索选来的专辑） */
let guest = false;      /* true = 当前看的是搜索结果，不在今日队列里 */
let guestList = [];     /* 搜索选中之后，左右箭头翻的就是这一串结果 */
let guestIndex = 0;     /* 当前看的是这串里的第几个 */
let source = "day";     /* day = 今日这一屏 ｜ fav = 我的收藏 */
const srcPos = { day: 0, fav: 0 };   /* 两个队列各自记住翻到哪儿 */
let favs = [];          /* 收藏列表（顺序 = 收藏时间） */
let favIds = new Set(); /* "id:sf"，用来判断当前这张是否已收藏 */
let coversBase = "";    /* 本地封面目录（Tauri 下由 Rust 给出） */
let invoke = null;      /* Tauri 的命令入口；浏览器里保持 null */
let flipped = false;
let searchOpen = false;

/* ---------------- 每日轮播 ----------------
   三种停留：正常时长 T（托盘菜单可调）、恢复时长（挂起回来接着看，最多 4s）、
   手动时长 1.5T（用户自己切过的那张多留一会儿）。
   计时从「这张图真正显示出来」开始，所以网慢不会吃掉观看时间。
   挂起条件：关掉轮播 / 搜索浮层打开 / 正在看搜索结果 / 翻到背面 / 窗口收进托盘。 */
const CAR_RESUME_CAP = 4000;
const CAR_MANUAL_MULT = 1.5;
let carSec = 8;                 /* 0 = 关闭 */
let winVisible = !document.hidden;
const car = { timer: 0, deadline: 0, left: -1, hold: 0 };

const win = document.getElementById("win");
const errBox = document.getElementById("err");
const errText = document.getElementById("err-text");

/* ---------------- 轮播的计时器 ---------------- */
function carMs(){ return carSec * 1000; }
function carBlocked(){ return carSec <= 0 || searchOpen || guest || flipped || !winVisible; }

/* 停表：把这一张还剩多久记下来（再挂起时接着看） */
function carStop(){
  if (!car.timer) return;
  car.left = Math.max(0, car.deadline - Date.now());
  clearTimeout(car.timer);
  car.timer = 0;
}
function carRun(ms){
  clearTimeout(car.timer);
  car.deadline = Date.now() + ms;
  car.timer = setTimeout(carTick, ms);
}
/* 挂起条件变了 / 新的一张显示出来了，都走这里；重复调用是安全的 */
function carSync(){
  if (carBlocked()){ carStop(); return; }
  if (car.timer) return;
  let ms;
  if (car.left >= 0) ms = Math.min(car.left, CAR_RESUME_CAP);   /* 挂起回来：接着看完，但不超上限 */
  else if (car.hold > 0) ms = car.hold;                         /* 手动切过的那张：多留一会儿 */
  else ms = carMs();
  car.left = -1;
  car.hold = 0;
  carRun(ms);
}
function carTick(){
  car.timer = 0;
  car.left = -1;
  if (carBlocked()) return;
  step(1, { auto: true });
}
/* 用户自己切过之后，这张按 1.5 倍时长算 */
function carManualHold(){ car.hold = carMs() * CAR_MANUAL_MULT; }

/* ---------------- 收藏 ---------------- */
const favKey = (a) => a.id + ":" + (a.sf || "");
/* Tauri 里本地图片要用 asset 协议转成可访问的 URL；浏览器里没有这些，走原路径 */
function localUrl(path){
  const T = window.__TAURI__;
  if (T && T.core && T.core.convertFileSrc) return T.core.convertFileSrc(path);
  return path;
}
/* 收藏条目 → 界面用的专辑对象（有本地封面就优先用本地） */
function favToAlbum(f){
  return {
    id: f.id, sf: f.sf, title: f.title, artist: f.artist,
    date: f.date || "", genre: f.genre || "", tracks: f.tracks || 0, art: f.art,
    local: f.cover && coversBase ? localUrl(coversBase + "/" + f.cover) : "",
    track_list: Array.isArray(f.track_list) ? f.track_list : [],
  };
}
function applyFavList(list){
  favs = Array.isArray(list) ? list : [];
  favIds = new Set(favs.map(favKey));
  document.getElementById("tab-fav").disabled = favs.length === 0;
  updateHeart();
}
function updateHeart(){
  const h = document.getElementById("heart");
  h.classList.toggle("faved", !!(current && favIds.has(favKey(current))));
}
let heartTimer;
const HEART_IDLE = 200;          /* 没点它：静置多久后收走 */
const HEART_AFTER_CLICK = 80;    /* 变红/变空之后只保留 100ms，然后就走 */
const HEART_POP_MS = 50;         /* 弹一下的时长 */
function hideHeart(){
  clearTimeout(heartTimer);
  document.getElementById("heart").classList.remove("show");
}
/* 右键：心形出现在鼠标位置（收藏时是红心，未收藏是空心） */
function showHeartAt(clientX, clientY){
  const h = document.getElementById("heart");
  const rect = win.getBoundingClientRect();
  h.style.left = (clientX - rect.left) + "px";
  h.style.top = (clientY - rect.top) + "px";
  updateHeart();
  h.classList.add("show");
  clearTimeout(heartTimer);
  heartTimer = setTimeout(hideHeart, HEART_IDLE);
}
/* 心形反馈：必须在"点下去的那一帧"就给出来。
   收藏要下载封面 + 抓曲目（1~3 秒），所以这里先乐观地改状态（变红/变空心 + 弹一下），
   落盘失败再回滚并抖一下——不能等网络回来才给反馈，也不能假装成功。 */
async function toggleFavorite(){
  const a = current;
  if (!a) return;
  const k = favKey(a);
  const wasFaved = favIds.has(k);
  const h = document.getElementById("heart");

  /* 1) 立刻反馈 */
  if (wasFaved) favIds.delete(k); else favIds.add(k);
  updateHeart();
  h.classList.remove("pop");
  void h.offsetWidth;                 /* 强制重排，连点也能重新播动画 */
  h.classList.add("pop");
  setTimeout(() => h.classList.remove("pop"), HEART_POP_MS);
  clearTimeout(heartTimer);
  heartTimer = setTimeout(hideHeart, HEART_AFTER_CLICK);

  /* 2) 再落盘（浏览器里没有 invoke，保持"只做视觉"） */
  if (typeof invoke !== "function") return;
  try {
    const list = wasFaved
      ? await invoke("remove_favorite", { id: a.id, sf: a.sf })
      : await invoke("add_favorite", {
          album: {
            id: a.id, sf: a.sf, title: a.title, artist: a.artist,
            date: a.date || "", genre: a.genre || "", tracks: a.tracks || 0, art: a.art,
          },
        });
    applyFavList(list);
  } catch (err){
    /* 3) 失败就回滚 + 抖一下，让人知道没成功 */
    if (wasFaved) favIds.add(k); else favIds.delete(k);
    updateHeart();
    document.getElementById("heart").classList.add("show");
    h.classList.add("nope");
    setTimeout(() => h.classList.remove("nope"), 420);
    clearTimeout(heartTimer);
    heartTimer = setTimeout(hideHeart, 1600);
    return;
  }
  if (source === "fav") rebuildFavQueue();
}
function rebuildFavQueue(){
  const items = favs.map(favToAlbum);
  if (!items.length){ switchSource("day"); return; }
  queue = items;
  pos = Math.min(pos, items.length - 1);
  srcPos.fav = pos;
  show(queue[pos]);
}

/* ---------------- 每日一屏：每天联网随机抽 20 张 ----------------
   桌面版交给 Rust（daily_today）：今天拉过就直接用本地那份，没拉过才联网，
   联网时按「最近 60 天不重复」筛候选；浏览器里预览时退化成抓一个榜单。 */
const DAILY_FAIL = "今天这 20 张没拉到，检查一下网络再重试";

function applyDaily(albums){
  dayQueue = (albums || []).map((a) => ({ ...a, _anniv: !!a.anniv }));
}

function invokeDaily(){
  if (typeof invoke === "function") return invoke("daily_today", { date: dayKey });
  return previewDaily();
}

/* 浏览器预览兜底：JSONP 抓一个榜单随机取 20 张（桌面版走不到这里） */
async function previewDaily(){
  const sf = ["us", "gb", "jp", "tw", "de", "fr"][(Math.random() * 6) | 0];
  const g = [0, 14, 17, 7, 11, 20, 24][(Math.random() * 7) | 0];
  const json = await fetchJson(`${API}/${sf}/rss/topalbums/limit=100${g ? "/genre=" + g : ""}/json`);
  const rows = (json.feed && json.feed.entry) || [];
  const list = rows.map((e) => ({
    id: e.id.attributes["im:id"], sf,
    title: e["im:name"].label, artist: e["im:artist"].label,
    date: (e["im:releaseDate"] ? e["im:releaseDate"].label : "").slice(0, 10),
    genre: e.category ? e.category.attributes.label : "",
    tracks: Number(e["im:itemCount"] ? e["im:itemCount"].label : 0),
    art: e["im:image"][e["im:image"].length - 1].label.replace(/\/\d+x\d+bb\..*$/, ""),
  })).filter((a) => a.art);
  for (let i = list.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    [list[i], list[j]] = [list[j], list[i]];
  }
  return { date: dayKey, albums: list.slice(0, 20) };
}

/* 拉今天这 20 张：拉的过程中整窗是毛玻璃（#boot 那层），第一张封面显示出来才撤掉。
   真去联网的那次至少亮 700ms——网快的时候一闪而过，等于没看见。 */
const GLASS_MIN_MS = 700;
async function loadDaily(){
  if (dailyBusy) return false;
  dailyBusy = true;
  const bootLayer = document.getElementById("boot");
  bootLayer.classList.remove("off");
  win.classList.add("loading");
  const t0 = Date.now();
  try {
    const res = await invokeDaily();
    if (!res.cached){
      const left = GLASS_MIN_MS - (Date.now() - t0);
      if (left > 0) await sleep(left);
    }
    applyDaily(res.albums);
    return dayQueue.length > 0;
  } catch (err){
    if (!dayQueue.length){
      errText.textContent = String((err && err.message) || DAILY_FAIL);
      errBox.hidden = false;
    }
    return false;
  } finally {
    dailyBusy = false;
    win.classList.remove("loading");
    /* 没拿到就撤掉玻璃层，让底下的错误提示露出来 */
    if (!dayQueue.length) bootLayer.classList.add("off");
  }
}

/* ---------------- 两个队列（今日 / 收藏） ---------------- */
function queueFor(src){
  return src === "fav" ? favs.map(favToAlbum) : dayQueue;
}
function setPos(p){
  pos = p;
  srcPos[source] = p;
}
function switchSource(next){
  if (next === source) return;
  if (next === "day" && !dayQueue.length){ goToday(); return; }   /* 今天还没拉到：先去拉 */
  srcPos[source] = pos;                 /* 记住这个队列翻到哪儿了 */
  source = next;
  queue = queueFor(source);
  if (!queue.length){ source = "day"; queue = queueFor("day"); }
  pos = Math.min(srcPos[source] || 0, Math.max(0, queue.length - 1));
  srcPos[source] = pos;
  guest = false;
  carStop(); car.left = -1; carManualHold();
  show(queue[pos]);
  flash(true);
}
const STORE = {
  get(k, fallback){
    try { const v = localStorage.getItem("coverart.mini." + k); return v === null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(k, v){ try { localStorage.setItem("coverart.mini." + k, JSON.stringify(v)); } catch {} },
};

/* ---------------- 封面渲染：双层交叉淡入，换图不闪白 ---------------- */
const layers = [document.getElementById("artA"), document.getElementById("artB")];
let layerTop = 1;

function paint(album){
  const next = layers[1 - layerTop];
  const cur = layers[layerTop];
  /* 图没在缓存里就得等网络：等超过 120ms 还没到，就先把当前这张磨成毛玻璃，
     换图完成后再撤掉（缓存命中时几十毫秒就回来了，不会闪一下） */
  let settled = false;
  const frostTimer = setTimeout(() => {
    if (settled) return;
    win.classList.add("loading");
    cur.classList.add("blurred");
  }, 120);
  const settle = () => {
    settled = true;
    clearTimeout(frostTimer);
    win.classList.remove("loading");
    setTimeout(() => cur.classList.remove("blurred"), 460);   /* 等它淡出完再还原 */
  };
  next.onload = () => {
    next.classList.add("in");
    setTimeout(() => cur.classList.remove("in"), 260);
    layerTop = 1 - layerTop;
    document.getElementById("boot").classList.add("off");
    errBox.hidden = true;
    settle();
    adaptChrome(next);                        /* 顶栏颜色跟着这张封面的亮度走 */
    carSync();                                /* 这张真正显示出来了，才开始倒数 */
  };
  next.onerror = () => {
    /* 带 CORS 的加载失败时，退化成普通加载再试一次（代价是不能读像素，只能固定深色顶栏） */
    if (next.crossOrigin){
      next.crossOrigin = null;
      next.src = next.dataset.src;
      return;
    }
    settle();
    errText.textContent = "封面加载失败，可能是网络问题或 Apple 图床被限流。";
    errBox.hidden = false;
  };
  next.dataset.src = album.local || art(album, SIZE.mid);   /* 收藏过的用本地缓存，离线也能看 */
  next.src = next.dataset.src;
  next.alt = `${album.title} — ${album.artist}`;

  document.getElementById("m-title").textContent = album.title;
  document.getElementById("m-artist").textContent = album.artist;
  /* 右下角：第几张 / 共几张。看今日这一屏时是队列里的位置，
     看搜索结果时是「这串结果里的第几个」 */
  const countEl = document.getElementById("m-count");
  if (guest && guestList.length > 1){
    countEl.textContent = `${guestIndex + 1}/${guestList.length}`;
    countEl.title = `搜索结果 第 ${guestIndex + 1} 张 · 共 ${guestList.length} 张`;
  } else if (guest){
    countEl.textContent = "";
    countEl.title = "";
  } else {
    countEl.textContent = `${pos + 1}/${queue.length}`;
    countEl.title = source === "fav"
      ? `收藏 第 ${pos + 1} 张 · 共 ${queue.length} 张`
      : `第 ${pos + 1} 张 · 共 ${queue.length} 张`;
  }
  document.getElementById("badge").hidden = !album._anniv;
  document.title = `${album.artist} — ${album.title}`;

  document.getElementById("backBg").src = art(album, SIZE.blur);
  document.getElementById("b-title").textContent = album.title;
  document.getElementById("b-artist").textContent = album.artist;
  document.getElementById("b-cat").textContent = `CAT. ${album.id} · ${album.sf.toUpperCase()}`;
  document.getElementById("b-line").textContent =
    [`℗ ${album.date ? album.date.slice(0, 4) : "—"}`, album.tracks ? `${album.tracks} TRACKS` : null,
     album.sf.toUpperCase()].filter(Boolean).join(" · ");
  const facts = [
    album.date ? album.date.slice(0, 4) : null,
    album.genre,
    album.tracks ? album.tracks + " 首" : null,
    album._anniv ? "发行纪念日" : null,
  ].filter(Boolean);
  document.getElementById("b-facts").innerHTML = facts.map((f, i) =>
    (i ? '<span style="opacity:.5"> · </span>' : "") + `<b>${esc(f)}</b>`).join("");
  document.getElementById("b-apple").href = `https://music.apple.com/${album.sf}/album/${album.id}`;
  document.getElementById("b-hires").href = art(album, SIZE.hi);

  loadTracks(album);
  preloadNeighbours();
}

/* 顶栏那套控件压在封面最上方，颜色得跟着封面走：
   取封面顶部中间那条的平均亮度（大致就是顶栏背后那块），
   亮 → 换浅色玻璃 + 深色字；暗 → 保持深色玻璃 + 白字。 */
function adaptChrome(img){
  try {
    const c = document.createElement("canvas");
    c.width = 24; c.height = 8;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    const sx = img.naturalWidth * 0.32, sw = img.naturalWidth * 0.36;
    const sy = 0, sh = Math.max(1, img.naturalHeight * 0.14);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height).data;
    let sum = 0;
    for (let i = 0; i < d.length; i += 4)
      sum += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    const lum = sum / (d.length / 4);
    win.classList.toggle("on-light", lum > 0.58);
    return lum;
  } catch {
    win.classList.remove("on-light");         /* 读不了像素（跨域）就退回深色顶栏 */
    return null;
  }
}

/* 预加载左右邻居，切换时基本是秒开 */
function preloadNeighbours(){
  /* 看搜索结果时，预加载的是相邻的那两条结果 */
  if (guest){
    if (guestList.length < 2) return;
    [1, -1].forEach((d) => {
      const a = guestList[(guestIndex + d + guestList.length) % guestList.length];
      if (a){ const im = new Image(); im.src = art(a, SIZE.mid); }
    });
    return;
  }
  [1, -1].forEach((d) => {
    const a = queue[(pos + d + queue.length) % queue.length];
    if (a){ const im = new Image(); im.src = art(a, SIZE.mid); }
  });
}

function show(album, { isGuest = false } = {}){
  current = album;
  guest = isGuest;
  paint(album);
  /* 记住今天看到第几张，下次打开接着看 */
  if (!guest && source === "day") STORE.set("view", { date: dayKey, pos });
  syncMode();
  if (carBlocked()) carStop();    /* 进了挂起状态就停表（什么时候起表由 carSync 决定） */
}

function step(d, { auto = false } = {}){
  carStop();                 /* 换封面了，旧的那次倒数作废 */
  car.left = -1;
  if (!auto) carManualHold();   /* 手动切换：这张多留一会儿再回到自动轮播 */
  /* 看搜索结果时：左右箭头在「搜索结果的队列」里翻 */
  if (guest){
    if (guestList.length < 2) return;
    guestIndex = (guestIndex + d + guestList.length) % guestList.length;
    show(guestList[guestIndex], { isGuest: true });
    if (!auto) flash(true);
    return;
  }
  if (!queue.length) return;      /* 今天这 20 张还没拉到（或者拉挂了），没得翻 */
  pos = (pos + d + queue.length) % queue.length;
  setPos(pos);
  show(queue[pos]);
  /* 自动轮播换图时不亮任何控件：轮播就该是一张干净的封面
     （手动切才亮出来，让人看到序号和左右箭头） */
  if (!auto) flash(true);
}

async function goToday(){
  dayKey = iso(new Date());
  source = "day";
  guest = false;
  if (!dayQueue.length) await loadDaily();
  if (!dayQueue.length) return;        /* 还是没拉到：错误层已经在提示了 */
  queue = dayQueue;
  setPos(0);
  carStop(); car.left = -1; carManualHold();
  show(queue[0]);
  flash(true);
}

/* 顶栏三种状态：
   day    = 在今日这一屏        → 「每日」高亮，左右箭头可用
   search = 搜索浮层打开        → 「搜索」高亮
   guest  = 正在看搜索选来的专辑 → 两个都不高亮，左右箭头禁用
   （搜索选来的专辑不在今日队列里，没有"上一张/下一张"这回事） */
function syncMode(){
  mode = searchOpen ? "search" : guest ? "guest" : source === "fav" ? "fav" : "day";
  if (mode !== "guest") win.classList.remove("tb-late");
  setTabs();
}

/* ---------------- 下载封面（原图 3000×3000） ---------------- */
async function downloadCover(){
  const album = current;
  if (!album) return;
  const url = art(album, SIZE.hi);
  const btn = document.getElementById("dl");
  const original = btn.innerHTML;
  const name = `${album.artist} - ${album.title}`.replace(/[\\/:*?"<>|]/g, "_").slice(0, 120) + ".jpg";
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(String(res.status));
    const href = URL.createObjectURL(await res.blob());
    const a = document.createElement("a");
    a.href = href; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 4000);
    /* 不发文字提示，用一个勾表示完成 */
    btn.classList.add("done");
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7"/></svg>';
    setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = original; }, 1500);
  } catch {
    /* 图床不允许跨域读 blob 时，退化成在新标签页打开原图 */
    window.open(url, "_blank", "noopener");
  }
}

/* ---------------- 翻面 ---------------- */
function setFlip(v){
  if (v === flipped) return;
  flipped = v;
  win.classList.toggle("flipped", v);
  if (v) document.getElementById("b-tracks").scrollTop = 0;

}

/* ---------------- 曲目：按需拉取 + 本地缓存 7 天 ---------------- */
const TRACK_TTL = 1000 * 60 * 60 * 24 * 7;
const trackMemo = new Map();

async function loadTracks(album){
  const el = document.getElementById("b-tracks");
  const k = key(album);
  /* 收藏时曲目表已经随收藏一起缓存下来了：直接用，断网也能翻背面 */
  if (Array.isArray(album.track_list) && album.track_list.length){
    trackMemo.set(k, album.track_list);
    return renderTracks(el, album.track_list);
  }
  if (trackMemo.has(k)) return renderTracks(el, trackMemo.get(k));
  const cached = STORE.get("tracks." + k, null);
  if (cached && Date.now() - cached.t < TRACK_TTL){
    trackMemo.set(k, cached.v);
    return renderTracks(el, cached.v);
  }
  el.innerHTML = `<li class="dim"><span class="n"></span><span class="t">载入曲目…</span><span class="lead"></span><span class="d"></span></li>`;
  try {
    const url = `${API}/lookup?${new URLSearchParams({ id:album.id, entity:"song", country:album.sf, limit:200 })}`;
    const json = await fetchJson(url);
    const rows = (json.results || []).filter((r) => r.wrapperType === "track")
      .map((r) => ({ n:r.trackNumber, name:r.trackName, ms:r.trackTimeMillis }));
    trackMemo.set(k, rows);
    STORE.set("tracks." + k, { t:Date.now(), v:rows });
    if (current && key(current) === k) renderTracks(el, rows);
  } catch {
    if (current && key(current) === k){
      el.innerHTML = `<li class="dim"><span class="n"></span><span class="t">曲目暂时取不到，稍后再试</span><span class="lead"></span><span class="d"></span></li>`;
    }
  }
}

function renderTracks(el, rows){
  if (!rows || !rows.length){
    el.innerHTML = `<li class="dim"><span class="n"></span><span class="t">暂无曲目信息</span><span class="lead"></span><span class="d"></span></li>`;
    return;
  }
  /* 像唱片背面那样排版：编号 + 曲名 + 虚线引导 + 时长，按 A/B 面分段 */
  const row = (t) => `<li>
    <span class="n">${t.n ? String(t.n).padStart(2, "0") : ""}</span>
    <span class="t">${esc(t.name || "")}</span>
    <span class="lead"></span>
    <span class="d">${t.ms ? fmt(t.ms) : ""}</span></li>`;
  const side = (label) => `<li class="side"><span>${label}</span></li>`;
  if (rows.length > 4){
    const half = Math.ceil(rows.length / 2);
    el.innerHTML = side("SIDE A") + rows.slice(0, half).map(row).join("")
                 + side("SIDE B") + rows.slice(half).map(row).join("");
  } else {
    el.innerHTML = rows.map(row).join("");
  }
}

/* ---------------- 接口：用 JSONP 取数 ----------------
   iTunes 的公开接口支持 callback=，走 <script> 而不是 fetch：
   本地双击打开（file://）时 fetch 会被 CORS 挡掉，JSONP 不受影响。
   失败按 3 次指数退避重试，配合内存 + localStorage 两级缓存。 */
let jsonpSeq = 0;
function fetchJson(url, attempt = 0){
  return new Promise((resolve, reject) => {
    const cb = "__coverart" + (++jsonpSeq);
    const el = document.createElement("script");
    let settled = false;
    const done = (fn, arg) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch { window[cb] = undefined; }
      el.remove();
      fn(arg);
    };
    const timer = setTimeout(() => done(reject, new Error("timeout")), 12000);
    window[cb] = (data) => done(resolve, data);
    el.onerror = () => {
      if (attempt >= 3){ done(reject, new Error("network")); return; }
      clearTimeout(timer);
      try { delete window[cb]; } catch {}
      el.remove();
      settled = true;
      sleep(600 * Math.pow(1.9, attempt) + Math.random() * 300)
        .then(() => fetchJson(url, attempt + 1)).then(resolve, reject);
    };
    const u = new URL(url);
    u.searchParams.set("callback", cb);
    el.src = u.toString();
    document.head.appendChild(el);
  });
}

const SEARCH_TTL = 1000 * 60 * 30;
const memo = new Map();
function cacheGet(k){
  const rec = STORE.get("search." + k, null);
  return rec && Date.now() - rec.t < SEARCH_TTL ? rec.v : null;
}
function cacheSet(k, v){ STORE.set("search." + k, { t:Date.now(), v }); }
function once(k, produce){
  if (memo.has(k)) return Promise.resolve(memo.get(k));
  const cached = cacheGet(k);
  if (cached){ memo.set(k, cached); return Promise.resolve(cached); }
  return produce().then((v) => { memo.set(k, v); cacheSet(k, v); return v; });
}

const mapItem = (sf) => (r) => ({
  id: String(r.collectionId), sf,
  title: r.collectionName, artist: r.artistName,
  date: (r.releaseDate || "").slice(0, 10),
  genre: r.primaryGenreName, tracks: r.trackCount,
  art: (r.artworkUrl100 || "").replace(/\/100x100bb\..*$/, ""),
});
const searchAlbums = (term, sf) => once(`${sf}:${term.toLowerCase()}`, async () => {
  const json = await fetchJson(`${API}/search?${new URLSearchParams({ term, entity:"album", limit:24, country:sf })}`);
  return (json.results || []).map(mapItem(sf));
});
const sharesChar = (term, name) => { const set = new Set(name || ""); return [...(term || "")].some((ch) => set.has(ch)); };
/* 先解析音乐人再取专辑：解决繁简体与致敬专辑抢位的问题（中文场景必须） */
const albumsByArtist = (term, sf) => once(`${sf}!artist:${term.toLowerCase()}`, async () => {
  const found = await fetchJson(`${API}/search?${new URLSearchParams({ term, entity:"musicArtist", limit:5, country:sf })}`);
  const cands = (found.results || []).filter((r) => r.artistId);
  if (!cands.length) return null;
  const pick = cands.find((r) => sharesChar(term, r.artistName)) || cands[0];
  const albums = await fetchJson(`${API}/lookup?${new URLSearchParams({ id:pick.artistId, entity:"album", limit:60, country:sf })}`);
  return (albums.results || []).filter((r) => r.wrapperType === "collection").map(mapItem(sf));
});

const HAS_CJK = /[\u3400-\u9fff\u3040-\u30ff]/;
const ALIAS = { "周杰伦":"Jay Chou","周杰倫":"Jay Chou","王菲":"Faye Wong","五月天":"Mayday",
  "陈奕迅":"Eason Chan","陳奕迅":"Eason Chan","万能青年旅店":"Omnipotent Youth Society",
  "萬能青年旅店":"Omnipotent Youth Society","邓丽君":"Teresa Teng","鄧麗君":"Teresa Teng" };

function relevance(term, a){
  const t = norm(term), ti = norm(a.title), ar = norm(a.artist);
  let s = 0;
  if (ti === t) s += 12; else if (ti.startsWith(t)) s += 7; else if (ti.includes(t)) s += 4;
  if (ar === t) s += 9; else if (ar.startsWith(t)) s += 5; else if (ar.includes(t)) s += 2;
  if ((a.tracks || 0) >= 6) s += 2;
  if (/\b(single|ep|remix|karaoke|tribute|cover|instrumental)\b/i.test(a.title)) s -= 5;
  if (a.date) s += Math.max(0, (parseInt(a.date.slice(0,4), 10) - 1980) / 400);
  return s;
}

/* 接口不可用时退化成「今天这一屏 + 收藏」的本地匹配，搜索不空手而归 */
function localSearch(term){
  const t = norm(term);
  return dayQueue.concat(favs.map(favToAlbum))
    .filter((a) => norm(a.title).includes(t) || norm(a.artist).includes(t))
    .map((a) => ({ ...a, _local:true }))
    .sort((a, b) => relevance(term, b) - relevance(term, a))
    .slice(0, 20);
}

/* ---------------- 搜索面板 ---------------- */
const searchEl = document.getElementById("search");
const qEl = document.getElementById("q");
const listEl = document.getElementById("s-list");
const stateEl = document.getElementById("s-state");
let results = [], sel = 0, seq = 0, debounce;

const IDLE_MSG = `<div class="s-msg">输入音乐人或专辑名，中英文皆可。<br>结果直接按 ↵ 换成当前封面。</div>`;

function openSearch(seed = ""){
  if (searchOpen) return;
  if (flipped) setFlip(false);
  searchOpen = true;
  syncMode();
  carSync();                     /* 打开搜索浮层 = 挂起轮播 */
  win.classList.add("searching");
  qEl.value = seed;
  results = []; sel = 0;
  stateEl.textContent = "";
  listEl.innerHTML = IDLE_MSG;
  qEl.focus();
  if (seed) runSearch(seed);
}
function closeSearch(){
  searchOpen = false;
  syncMode();
  carSync();                     /* 关掉浮层：如果回到今日这一屏，轮播继续 */
  win.classList.remove("searching");
  qEl.blur();
  flash(true);
}

function setTabs(){
  const activeId = { day: "tab-day", fav: "tab-fav", search: "tab-search" }[mode] || null;
  document.querySelectorAll(".topbar button").forEach((b) =>
    b.setAttribute("aria-selected", String(b.id === activeId)));
  win.classList.toggle("mode-guest", mode === "guest");
  /* 左右箭头两种模式都可用：今日这一屏里翻队列，看搜索结果时翻结果 */
  ["prev", "next"].forEach((id) => { document.getElementById(id).disabled = false; });
}

function renderResults(){
  listEl.innerHTML = results.map((a, i) => `
    <button class="r${i === sel ? " on" : ""}" type="button" data-i="${i}">
      <img src="${esc(art(a, SIZE.thumb))}" alt="" loading="lazy" draggable="false">
      <span class="r-txt">
        <span class="r-t">${esc(a.title)}</span>
        <span class="r-a">${esc(a.artist)}${a.date ? " · " + a.date.slice(0,4) : ""}</span>
      </span>
    </button>`).join("");
  listEl.querySelectorAll(".r").forEach((el) => el.addEventListener("click", () => pick(Number(el.dataset.i))));
  const on = listEl.querySelector(".r.on");
  if (on) on.scrollIntoView({ block:"nearest" });
}

function pick(i){
  const a = results[i];
  if (!a) return;
  closeSearch();
  /* 选中之后进入「浏览搜索结果」：左右箭头在这一串结果里翻，
     想回今日这一屏点顶栏「每日」或按 T */
  guestList = results.slice();
  guestIndex = i;
  show(a, { isGuest: true });
  /* 刚从搜索结果过来：把控件先亮着，让人一眼看到序号和左右箭头 */
  flash(false);
  /* 这一刻顶栏先收起来，鼠标一动它才回来（回来时「每日/搜索」都不高亮） */
  win.classList.toggle("tb-late", guest);
  if (flipped) setFlip(false);
}

async function runSearch(term){
  const query = (term || "").trim();
  const my = ++seq;
  if (!query){
    results = [];
    stateEl.textContent = "";
    listEl.innerHTML = IDLE_MSG;
    return;
  }
  stateEl.textContent = "…";
  listEl.innerHTML = `<div class="s-msg">搜索中…</div>`;
  try {
    const alias = ALIAS[query] || null;
    let groups;
    if (HAS_CJK.test(query)){
      /* 中文：先按音乐人解析（台湾店区），拿不到再退回关键词双店区查询 */
      const byArtist = await albumsByArtist(query, "tw").catch(() => null);
      if (byArtist && byArtist.length >= 3) groups = [byArtist];
      else groups = [await searchAlbums(alias || query, "us"), await searchAlbums(query, "tw")];
    } else {
      groups = [await searchAlbums(query, "us")];
    }
    if (my !== seq) return;
    const seen = new Set(), merged = [];
    for (const r of groups.flat()){
      const k = norm(r.artist) + "|" + norm(r.title);
      if (seen.has(k)) continue;
      seen.add(k); merged.push(r);
    }
    merged.forEach((r) => { r._s = relevance(query, r) + (alias ? relevance(alias, r) : 0); });
    merged.sort((a, b) => b._s - a._s);
    results = merged.filter((r) => r._s > 1).slice(0, 30);
    let local = false;
    if (!results.length){ results = localSearch(query); local = results.length > 0; }
    if (!results.length){
      listEl.innerHTML = `<div class="s-msg">没有找到「${esc(query)}」。<br>换个拼写或试试英文名。</div>`;
      stateEl.textContent = "0";
      return;
    }
    sel = 0;
    renderResults();
    stateEl.textContent = results.length + (local ? " · 本地" : "");
  } catch (err){
    if (my !== seq) return;
    const local = localSearch(query);
    if (local.length){
      results = local; sel = 0; renderResults();
      stateEl.textContent = local.length + " · 离线";
      return;
    }
    const slow = err && err.message === "timeout";
    stateEl.textContent = slow ? "超时" : "离线";
    listEl.innerHTML = `<div class="s-msg">${slow
      ? "Apple 接口没响应（可能被限流），十几秒后会恢复。"
      : "连不上 Apple 接口，检查一下网络或代理。"}<br><button id="s-retry" type="button">重试</button></div>`;
    const rb = document.getElementById("s-retry");
    if (rb) rb.addEventListener("click", () => runSearch(qEl.value));
  }
}

qEl.addEventListener("input", () => {
  seq++;                                  /* 立刻作废在途请求，避免旧结果盖住新输入 */
  clearTimeout(debounce);
  debounce = setTimeout(() => runSearch(qEl.value), 420);
});

/* ---------------- 悬停层：出现一下，然后还你一张干净的封面 ---------------- */
let barTimer;
function flash(reset = true){
  win.classList.add("hud-on");
  clearTimeout(barTimer);
  if (reset) barTimer = setTimeout(() => win.classList.remove("hud-on"), 2600);
}
win.addEventListener("pointermove", () => {
  win.classList.remove("tb-late");          /* 鼠标一动，刚收起的顶栏就回来 */
  /* 心形还在的话，鼠标动一动就给它续命（停住不动的才算"不用了"） */
  if (document.getElementById("heart").classList.contains("show")){
    clearTimeout(heartTimer);
    heartTimer = setTimeout(hideHeart, HEART_IDLE);
  }
  if (!searchOpen && !flipped) flash();
});
win.addEventListener("pointerleave", () => { win.classList.remove("hud-on"); });
/* 鼠标停在顶栏 / 信息条 / 日期箭头上时，不要自动把控件收走 */
[".topbar", ".hudbar"].forEach((sel) => {
  const box = win.querySelector(sel);
  if (!box) return;
  box.addEventListener("pointerenter", () => { win.classList.add("hud-on"); clearTimeout(barTimer); });
  box.addEventListener("pointerleave", () => { if (!searchOpen && !flipped) flash(true); });
});

/* ---------------- 输入 ---------------- */
document.getElementById("prev").addEventListener("click", (e) => { e.stopPropagation(); step(-1); });
document.getElementById("next").addEventListener("click", (e) => { e.stopPropagation(); step(1); });
document.getElementById("dl").addEventListener("click", (e) => { e.stopPropagation(); downloadCover(); });
document.getElementById("to-back").addEventListener("click", (e) => { e.stopPropagation(); setFlip(true); });
document.getElementById("to-front").addEventListener("click", () => setFlip(false));
document.getElementById("tab-day").addEventListener("click", (e) => {
  e.stopPropagation();
  closeSearch();                                   /* 顺手把搜索浮层收掉 */
  if (guest){ guest = false; show(queue[pos]); }   /* 从搜索选来的专辑回到当前这一屏 */
  switchSource("day");                             /* 切回今日这一屏 */
  carManualHold();                                 /* 回到这一屏也算手动，先多留一会儿 */
  flash(false);
});
document.getElementById("tab-fav").addEventListener("click", (e) => {
  e.stopPropagation();
  closeSearch();
  switchSource("fav");
});
document.getElementById("tab-search").addEventListener("click", (e) => {
  e.stopPropagation();
  openSearch(qEl.value || "");                     /* 再点搜索：直接回到刚才那串结果 */
});
document.querySelector(".front").addEventListener("dblclick", (e) => {
  if (e.target.closest(".nv, .icon-btn, .topbar")) return;
  setFlip(!flipped);
});
win.addEventListener("click", () => { if (!flipped && !searchOpen) flash(); });

/* 右键：在鼠标处弹出收藏心形（主窗口里右键菜单已被禁用，这里就是它的替代） */
win.addEventListener("contextmenu", (e) => {
  e.preventDefault();
  if (searchOpen) return;
  showHeartAt(e.clientX, e.clientY);
  flash(false);                       /* 右键是主动操作，顺手把控件亮出来 */
});
document.getElementById("heart").addEventListener("click", (e) => {
  e.stopPropagation();
  toggleFavorite();
});
/* 鼠标停在心里上就不自动收走，方便连着点 */
document.getElementById("heart").addEventListener("pointerenter", () => clearTimeout(heartTimer));
document.getElementById("heart").addEventListener("pointerleave", () => {
  clearTimeout(heartTimer);
  heartTimer = setTimeout(hideHeart, 1200);
});

let wheelLock = 0;
win.addEventListener("wheel", (e) => {
  if (searchOpen || flipped) return;
  e.preventDefault();
  const now = Date.now();
  if (now - wheelLock < 280) return;
  wheelLock = now;
  step(e.deltaY > 0 ? 1 : -1);         /* 滚轮 = 翻封面 */
}, { passive:false });

addEventListener("keydown", (e) => {
  /* 搜索面板的键盘统一在全局处理：焦点不在输入框时（比如刚点过结果）也照样能用 */
  if (searchOpen){
    const k = e.key;
    if (k === "Escape"){ e.preventDefault(); closeSearch(); }
    else if (k === "Enter"){ e.preventDefault(); clearTimeout(debounce); pick(sel); }
    else if (k === "ArrowDown"){ e.preventDefault(); if (results.length){ sel = (sel + 1) % results.length; renderResults(); } }
    else if (k === "ArrowUp"){ e.preventDefault(); if (results.length){ sel = (sel - 1 + results.length) % results.length; renderResults(); } }
    else if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === "k"){ e.preventDefault(); qEl.select(); }
    return;
  }
  const k = e.key;
  if (k === "ArrowRight"){ e.preventDefault(); step(1); }
  else if (k === "ArrowLeft"){ e.preventDefault(); step(-1); }
  else if (k === " " || k === "Enter"){ e.preventDefault(); setFlip(!flipped); }
  /* esc：先翻回正面，再看是不是在"搜索选来的专辑"这一屏——是的话回到今日这一屏 */
  else if (k === "Escape"){
    if (flipped) setFlip(false);
    else if (guest){ guest = false; show(queue[pos]); flash(true); }
  }
  else if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === "k"){ e.preventDefault(); openSearch(""); }
  else if (k === "t" || k === "T"){ goToday(); }
  /* 直接打字即搜索：极简窗口里最省事的入口 */
  else if (k.length === 1 && !e.metaKey && !e.ctrlKey && !e.altKey){ openSearch(k); }
});

/* ---------------- 启动 ---------------- */
/* ---------------- 桌面端（Tauri）专属：整窗拖动 / 收起到托盘 / 屏蔽右键菜单 ---------------- */
(function desktop(){
  const T = window.__TAURI__;
  const closeBtn = document.getElementById("btn-close");
  /* 浏览器里打开原型时，这些能力都不存在：把 ✕ 拿掉，其余逻辑跳过 */
  if (!T){ closeBtn.remove(); return; }
  /* 不同版本暴露的位置不太一样，兜一下 */
  invoke = (T.core && T.core.invoke) || T.invoke
    || (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);
  if (typeof invoke !== "function"){ closeBtn.remove(); return; }

  /* 2. 主窗口里禁用右键菜单 */
  document.addEventListener("contextmenu", (e) => e.preventDefault());

  /* 轮播档位由托盘菜单决定：启动问一次，之后听事件（改完立刻生效，不用重启） */
  invoke("get_carousel").then((v) => { carSec = Number(v) || 0; carSync(); }).catch(() => {});

  /* 收藏：先拿本地封面目录，再读收藏列表（顺序别反，favToAlbum 要用到目录） */
  invoke("covers_dir_path")
    .then((dir) => { coversBase = dir || ""; return invoke("list_favorites"); })
    .then((list) => { applyFavList(list); if (source === "fav") rebuildFavQueue(); })
    .catch(() => {});
  if (T.event && T.event.listen){
    T.event.listen("carousel-changed", (e) => {
      carSec = Number(e.payload) || 0;
      carStop();              /* 改档位对当前这张也立刻生效：按新时长重新开始倒数 */
      car.left = -1;
      carSync();
    });
    /* 窗口收进托盘 / 重新显示：让轮播挂起与恢复（visibilitychange 之外的兜底） */
    T.event.listen("window-visible", (e) => { winVisible = !!e.payload; carSync(); });
  }

  /* 4. 右上角 ✕ → 收起到托盘（不退出） */
  closeBtn.addEventListener("click", (e) => { e.stopPropagation(); invoke("hide_to_tray"); });

  /* 背面的两个外链：交给系统默认浏览器打开，而不是在窗口里开新页面 */
  ["b-apple", "b-hires"].forEach((id) => {
    const link = document.getElementById(id);
    if (!link) return;
    link.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      invoke("open_external", { url: link.href });
    });
  });

  /* 3. 整窗可拖：按住任意空白处移动超过 4px 才交给系统拖窗口，
        于是「点一下」仍然是点击/双击，不会被拖动吃掉 */
  let armed = false, dragging = false, sx = 0, sy = 0;
  win.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (e.target.closest("button, input, a")) return;
    armed = true; dragging = false; sx = e.clientX; sy = e.clientY;
  });
  win.addEventListener("pointermove", (e) => {
    if (!armed || dragging) return;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) > 4){
      dragging = true;
      invoke("start_drag");
    }
  });
  const stopDrag = () => { armed = false; dragging = false; };
  win.addEventListener("pointerup", stopDrag);
  win.addEventListener("pointercancel", stopDrag);
  win.addEventListener("pointerleave", stopDrag);
})();

document.getElementById("err-retry").addEventListener("click", async () => {
  errBox.hidden = true;
  if (current){ paint(current); return; }        /* 只是封面挂了：重画这张就行 */
  if (await loadDaily()){                        /* 每日没拉到：重新去拉今天这 20 张 */
    queue = dayQueue;
    setPos(0);
    show(queue[0]);
  }
});

/* 跨午夜时自动换成新一天的队列 */
async function refreshDay(){
  const k = iso(new Date());
  if (k === dayKey) return;
  dayKey = k;
  await loadDaily();
  if (source === "day" && !guest && dayQueue.length){
    queue = dayQueue;
    setPos(0);
    show(queue[0]);
  }
}
document.addEventListener("visibilitychange", () => {
  winVisible = !document.hidden;   /* 收进托盘/最小化 → 轮播挂起；回来再继续 */
  carSync();
  if (!document.hidden) refreshDay();
});

(async function boot(){
  setTabs();
  if (!await loadDaily()) return;      /* 拉不到就先停在错误提示上，等用户点重试 */

  queue = dayQueue;
  const saved = STORE.get("view", null);
  if (saved && saved.date === dayKey && saved.pos < dayQueue.length) setPos(saved.pos);
  show(queue[pos]);

  /* 首次打开给一次手势提示，之后不再打扰 */
  if (!STORE.get("seen", false)){
    const hint = document.createElement("div");
    hint.id = "hint";
    hint.textContent = "← → 换封面 · 双击看曲目 · 打字搜索";
    win.appendChild(hint);
    setTimeout(() => hint.classList.add("off"), 5200);
    setTimeout(() => hint.remove(), 6200);
    STORE.set("seen", true);
  }

})();
</script>
