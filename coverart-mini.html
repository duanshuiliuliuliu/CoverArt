<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>CoverArt — 原型预览</title>
<style>
  /* 这一页只是浏览器里的「窗口模拟」：方形区域 = 程序里的窗口，
     里面装的就是程序真正使用的 ui/index.html（同一份文件，不是复制品）。 */
  :root{ --side:min(100vw, 100vh, 640px); --win-r:14px; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:#0c0c0e; color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",
                "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:grid; place-items:center; overflow:hidden;
  }
  #stage{
    width:var(--side); height:var(--side);
    border-radius:var(--win-r); overflow:hidden; background:#121214;
    box-shadow:0 34px 70px rgba(0,0,0,.6), 0 3px 14px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08);
  }
  #stage iframe{display:block; width:100%; height:100%; border:0}
  #demo{
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%); margin:0;
    font-size:11px; color:rgba(255,255,255,.34); white-space:nowrap;
    pointer-events:none; transition:opacity .8s;
  }
  #demo.off{opacity:0}
</style>
</head>
<body>

<div id="stage"><iframe src="ui/index.html" title="CoverArt 界面"></iframe></div>
<p id="demo"></p>

<script>
  /* 说明条：告诉你这个方块就是程序里的窗口，里面跑的是同一份界面文件 */
  const stage = document.getElementById("stage");
  const demo = document.getElementById("demo");
  const update = () => {
    const r = stage.getBoundingClientRect();
    demo.textContent = `窗口 ${Math.round(r.width)} × ${Math.round(r.height)} · 里面就是程序用的 ui/index.html`;
  };
  update();
  addEventListener("resize", update);
  setTimeout(() => demo.classList.add("off"), 6000);
</script>
</body>
</html>
